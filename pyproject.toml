[project]
name = "ecommerce-performance-analyst"
version = "0.1.0"
description = "Domain-constrained AI analytics foundation for e-commerce performance analysis."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "E-commerce Performance Analyst Contributors" }
]
dependencies = [
  "duckdb>=1.1.0",
  "langchain>=0.3.0",
  "langgraph>=0.2.0",
  "pandas>=2.2.0",
  "plotly>=5.24.0",
  "pydantic>=2.8.0",
  "python-dotenv>=1.0.1",
]

[project.scripts]
ecommerce-analyst = "ecommerce_analyst.main:main"

[dependency-groups]
dev = [
  "mypy>=1.11.0",
  "pytest>=8.3.0",
  "pytest-cov>=5.0.0",
  "ruff>=0.6.0",
]

[build-system]
requires = ["setuptools>=69.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "N",
  "UP",
  "B",
  "A",
  "C4",
  "SIM",
  "PTH",
  "RUF",
]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
mypy_path = "src"
packages = ["ecommerce_analyst"]

[[tool.mypy.overrides]]
module = [
  "dotenv",
]
ignore_missing_imports = true
